# fly.toml app configuration file generated for decision-maker-cb on 2026-09-17T21:35:21-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'decision-maker-cb'
primary_region = 'iad'

[build]
  dockerfile = 'deploy/Dockerfile'

[env]
  ADDRESS_HEADER = 'Fly-Client-IP'
  ALLOW_FAKE_PROVIDER = '0'
  ALLOW_MAIL_SINK = '0'
  BODY_SIZE_LIMIT = '128K'
  DATABASE_URL = '/data/app.db'
  ORIGIN = 'https://decision-maker-cb.fly.dev'
  PORT = '3000'

[[mounts]]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
